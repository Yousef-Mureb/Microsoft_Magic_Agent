[project]
name = "ms-vendor-agent"
version = "0.3.0"
description = "Microsoft vendor agent for MAGIC: Microsoft answers with citations, Azure list prices, sizing and designs, in the vendor-agent/1 contract over A2A."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "azure-identity>=1.17",
    "azure-storage-blob>=12.20",
    "psycopg[binary]>=3.2",
    "resvg-py>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ms_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The live test reaches prices.azure.com; run it with `python -m pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: reaches the network (prices.azure.com); not run by default"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "evaluations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
